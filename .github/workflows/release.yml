name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make pkg
      - uses: actions/upload-artifact@v4
        with: { name: pkg, path: "lodge-*.pkg" }

  deb:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential debhelper
      - run: make deb
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: "lodge_*.deb" }

  publish:
    needs: [macos, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
