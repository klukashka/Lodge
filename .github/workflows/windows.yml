name: windows

# Builds lodge.exe and tries it on a real Windows machine. Runs on pushes that touch the program, by hand, and as a
# part of the release.
on:
  push:
    branches: ["**"]
    paths: ["src/**", "include/**", "texts/**", "Makefile", "scripts/win_smoke.py", ".github/workflows/windows.yml"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - run: make windows
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "lodge-*-windows-x64.zip" }

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pywinpty pyte
      - run: Expand-Archive (Get-Item lodge-*-windows-x64.zip) -DestinationPath unpacked
      - run: python scripts/win_smoke.py unpacked\lodge\lodge.exe
